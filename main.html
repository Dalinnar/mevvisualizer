<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deepslate Litematic Viewer</title>

<style>
/* ================= BASIC LAYOUT ================= */
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1e1e1e;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.main-content {
  display: flex;
  width: 100%;
  height: calc(100vh - 50px); /* Adjust based on your header height */
  align-items: center;
  padding: 10px;
  box-sizing: border-box;
}

/* ================= LABELS ================= */
.label-box {
  color: #0af;
  font-weight: bold;
  font-size: 14px;
  margin: 10px 0;
  background: #111;
  padding: 4px 8px;
  border-radius: 4px;
  min-width: 30px;
  text-align: center;
}

.canvas-container {
  flex: 1;
  height: 100%;
  border-radius: 8px;
  overflow: hidden;
}
.double-slider-container {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 60px;
  height: 100%;
  background: #2a2a2a;
  border-radius: 12px;
  margin-right: 15px;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  padding: 12px 0;
  box-sizing: border-box;
}
.double-slider-container.active {
  display: flex;
}

/* Editable number at top (max) and bottom (min) */
.slider-value-input {
  width: 44px;
  background: #111;
  color: #4a9eff;
  border: 1px solid #333;
  border-radius: 4px;
  font-family: monospace;
  font-size: 12px;
  font-weight: bold;
  text-align: center;
  padding: 4px 2px;
  box-sizing: border-box;
  cursor: text;
}
.slider-value-input:focus {
  outline: none;
  border-color: #4a9eff;
  box-shadow: 0 0 4px rgba(74, 158, 255, 0.4);
}

/* Wide transparent wrapper — thumbs live here */
.slider-track {
  position: relative;
  width: 28px;
  flex: 1;
  margin: 10px 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* The visible thin line */
.slider-track-line {
  position: absolute;
  top: 0; bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  background: #444;
  border-radius: 3px;
  pointer-events: none;
}

.slider-range {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  width: 6px;
  background: #4a9eff;
  border-radius: 3px;
  box-shadow: 0 0 8px rgba(74, 158, 255, 0.4);
  pointer-events: none;
}

.slider-thumb {
  position: absolute;
  left: 50%;
  width: 20px;
  height: 20px;
  background: #fff;
  border: 2px solid #4a9eff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: ns-resize;
  z-index: 2;
  transition: box-shadow 0.1s, top 0.1s ease-out;
  box-sizing: border-box;
}
.slider-thumb:hover,
.slider-thumb:active {
  box-shadow: 0 0 0 4px rgba(74, 158, 255, 0.3);
}

/* Visual distinction when thumbs overlap */
.slider-thumb.thumb-offset-max {
  background: #e8f4ff;
  border-color: #4a9eff;
  opacity: 0.9;
}

.slider-thumb.thumb-offset-min {
  background: #b3e5ff;
  border-color: #4a9eff;
  opacity: 0.9;
}

</style>

<body>

<!-- ================= FILE INPUT ================= -->
<div class="controls-container">
  <div class="file-input-container">
    <input id="file-input" type="file" accept=".litematic">
    <button id="clear-button">Clear</button>
    <button id="download-materials">Download Materials CSV</button>
  </div>
</div>

<!-- ================= CANVAS + SLIDER ================= -->
<div class="main-content">
  <div class="double-slider-container" id="slider-container">
    <!-- Slider thumbs and range will be inserted here by JS -->
  </div>
  <div class="canvas-container">
    <canvas id="structure-display" width="600" height="400"></canvas>
  </div>
</div>

<script src="https://unpkg.com/deepslate@0.25.1"></script>
<script src="https://cdn.jsdelivr.net/npm/gl-matrix@3.4.3/gl-matrix-min.js"></script>

<script type="module" src="./src/main.js"></script>


<script>
const canvas = document.getElementById('structure-display');

function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}

window.addEventListener('resize', () => {
  resizeCanvas();
  if (window.renderer && window.renderer.drawStructure) {
    renderer.drawStructure();
  }
});

resizeCanvas();
</script>

</body>
</html>
